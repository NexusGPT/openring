# Kernel ticks of 0.1 ms so that the timing cases measure the simulated drivers, not a 10 ms tick (as in tests/rhw and tests/audio)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# simulated time runs as fast as the host allows (the suites idle 10 s after each of the 72 rows of FW 1.2, twice)
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
