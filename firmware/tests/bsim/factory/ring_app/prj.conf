CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_THREAD_NAME=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ring"

# the factory part and the real beacon: the simulated drivers are OFF so that the beacon registers
CONFIG_RING_RHW=y
CONFIG_RING_RHW_SIM=n
CONFIG_RING_FACTORY=y
CONFIG_HWINFO=y
