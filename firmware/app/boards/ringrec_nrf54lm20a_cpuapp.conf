# The ring (step 7, board ringrec in firmware/boards/ringrec): the development kit's settings
# (nrf54lm20dk_nrf54lm20a_cpuapp.conf) plus what the real driver files need on the ring's devicetree
# (firmware/docs/recorder-notes.md section 6; firmware/docs/board-notes.md). Nothing here is proven on a ring.

# pairings and the active device survive a reset (Zephyr settings in RRAM)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# settings back end (open point K10, a PROPOSAL for the lead, board-notes.md): ZMS, the SDK's key-value store made
# for RRAM and MRAM as well as flash, on storage_partition (20 KB, design/firmware.md 9.2)
CONFIG_ZMS=y

# decision D11b: the real driver files, no simulated driver
CONFIG_RING_RHW_SIM=n
# the USB transfer part's real file (device stack "device_next", design/firmware.md 6.1)
CONFIG_USB_DEVICE_STACK_NEXT=y
# the system part's real file (update into slot 1, settings, retained memory, watchdog: docs/sys-notes.md section 6)
CONFIG_WATCHDOG=y
CONFIG_RETAINED_MEM=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# the audio part's real file: the kit's PDM driver behind the microphone API (design/firmware.md 4.1)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
# the storage part's real file: SD card over SPI through the disk access API (design/firmware.md 5.1)
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
# the "sleep" pin states (microphone clock low, storage lines disconnected) exist only with device power management:
# without it Zephyr leaves every "sleep" state out of the build (zephyr/drivers/pinctrl.h, PINCTRL_SKIP_SLEEP), and
# spi00's suspend (rst_hw_real.c) needs it too
CONFIG_PM_DEVICE=y

# the power chip nPM1304 (I2C): the kit's drivers for its regulators (the two load switches) and charger
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
# the power part's real file (modules/ring_power/src/rpw_hw_real.c, CONFIG_RING_POWER_REAL, on by default where the
# nPM1304 node exists) and the kit's fuel gauge library it calls; its calls were fixed to SDK v3.4.2 in step 7 fix
# round 1. The cell model is the board's include/rpw_battery_model.h: NOT THE RING'S CELL (a stand-in).
CONFIG_RING_POWER_REAL=y
CONFIG_NRF_FUEL_GAUGE=y
