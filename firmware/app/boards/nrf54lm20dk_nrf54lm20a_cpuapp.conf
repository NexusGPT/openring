# Development kit: pairings and the active device survive a reset (Zephyr settings in RRAM).
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Step 6, decision D11b: the development kit build uses the real driver files of the recorder parts (decision D15: each
# compiles only where its devicetree node exists; none is proven, docs/recorder-notes.md). No simulated driver here.
CONFIG_RING_RHW_SIM=n
# the USB transfer part's real file (device stack "device_next", design/firmware.md 6.1)
CONFIG_USB_DEVICE_STACK_NEXT=y
# the system part's real file (update into slot 1, settings, retained memory, watchdog: docs/sys-notes.md section 6)
CONFIG_WATCHDOG=y
CONFIG_RETAINED_MEM=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
