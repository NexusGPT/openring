CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# the glue needs the control part, which needs Bluetooth with the HID service (as in the product); nothing here enables
# Bluetooth (no bt_enable): the radio is not part of these suites
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ring"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_ID_MAX=3
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_HIDS_DEFAULT_PERM_RW_AUTHEN=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=3
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=24
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_RING_CORE=y
CONFIG_RING_DEVICES=y
CONFIG_RING_CONTROL=y
CONFIG_RING_GLUE=y
CONFIG_RING_GLUE_STACK_SIZE=8192
CONFIG_RING_INBOX=y
CONFIG_RING_TIME=y

# the screens on the memory display, with the read-back hooks
CONFIG_RING_SCREENS=y
CONFIG_RING_SCREENS_CAPTURE=y
CONFIG_RING_SCREENS_SIGN_WAIT_MS=2000
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_RING_SCREENS_STACK_SIZE=8192

# the recorder parts on the simulated drivers
CONFIG_RING_RHW=y
CONFIG_RING_RHW_SIM=y
CONFIG_RING_STORE=y
CONFIG_RING_AUDIO=y
CONFIG_RING_XFER=y
CONFIG_RING_POWER=y
CONFIG_RING_MOTOR=y
CONFIG_RING_SYS=y
CONFIG_RING_FACTORY=y
CONFIG_RING_RECORDER=y
CONFIG_RING_RECORDER_TEST_HOOKS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# a test card: each case starts on an empty card; the longest recording of a case (about 25 chunks) and the log fit
CONFIG_RING_RHW_SIM_DISK_POOL=6000
CONFIG_RING_RHW_SIM_LOG_SIZE=16384
