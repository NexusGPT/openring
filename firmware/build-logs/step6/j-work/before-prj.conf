CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Step 2: devices and control. Bluetooth peripheral with the HID service,
# one local identity per paired device (three), pairing with a displayed passkey.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ring"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_ID_MAX=3
CONFIG_BT_ATT_TX_COUNT=6
# the Apple and Nordic guidance: no automatic security request, no automatic PHY update
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_SC_ONLY=y

CONFIG_BT_CONN_CTX=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=3
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=24
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_AUTHEN=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_RING_CORE=y
CONFIG_RING_DEVICES=y
CONFIG_RING_CONTROL=y
CONFIG_RING_GLUE=y

# Step 3: the iPhone part. The kit's clients for Apple's Notification Center, Media and Current Time
# services and the GATT service (Service Changed) are selected by CONFIG_RING_IPHONE.
CONFIG_RING_INBOX=y
CONFIG_RING_TIME=y
CONFIG_RING_IPHONE=y
# link and stack settings of the iPhone part: modules/ring_iphone/ring_iphone_link.conf (EXTRA_CONF_FILE, app/CMakeLists.txt)

# Step 5: the relay service: a Bluetooth service of the ring that takes notifications from a helper app on an Android phone
# (design/firmware.md 7.7) and puts them in the same store as the iPhone's. Needs no setting of its own: the link settings above are shared.
CONFIG_RING_RELAY=y

# Step 4: the screens. LVGL (the kit's copy) draws in a 240 x 120 frame; the display is the memory display of
# ring_screens (devicetree overlay in boards/) until the panel driver exists.
CONFIG_RING_SCREENS=y
CONFIG_RING_SCREENS_REAL=y
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_RING_SCREENS_STACK_SIZE=8192

# round 2: static stack frame sizes (-fstack-usage) for tools/stack_report.py
CONFIG_STACK_USAGE=y

# round 2: stacks sized from the static chains of tools/stack_report.py plus a margin (no runtime peak exists: simulated builds run on host stacks)
CONFIG_RING_GLUE_STACK_SIZE=3072
CONFIG_BT_RX_STACK_SIZE=2048
