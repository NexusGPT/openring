# The link and stack settings the iPhone part needs. ONE file: the product application (app/CMakeLists.txt)
# and the test ring application (tests/bsim/iphone/ring_app/CMakeLists.txt) both add it with EXTRA_CONF_FILE, so
# they cannot differ. tools/build_all.sh (stage "link-settings") reads the built .config files and fails
# when the product's values differ from the test ring's.
# ATT MTU 247 (design/firmware.md section 7.1): Apple's answers and the media title (64 bytes) need it.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# every iPhone work item (discovery callbacks excepted) runs on the system workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_BT_GATT_DM_MAX_ATTRS=35
