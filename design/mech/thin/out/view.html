<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#15171c;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'assembled', cam = (q.get('cam') || '30,-60,60').split(',').map(Number);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(2); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15171c);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(30, 40, 50); scene.add(d);
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 400);
new GLTFLoader().load('thin-inside.glb', g => {
  const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; root.add(g.scene); scene.add(root);
  const info = g.parser.json.scenes[0].extras; const lay = {}; info.layers.forEach(l => l.parts.forEach(p => lay[p] = l.explode));
  g.scene.children.forEach(n => {
    if (mode === 'open' && ['cover_glass','clear_adhesive','screen','foam'].includes(n.name)) n.visible = false;
    if (n.name === 'outer_body' && mode !== 'solid' && mode !== 'closed') n.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = mode === 'exploded' ? 0.16 : 0.13; o.material.depthWrite = false; o.material.side = THREE.DoubleSide; } });
    if (mode === 'exploded') { const e = lay[n.name], ex = g.parser.json.nodes.find(x => x.name === n.name).extras;
      const v = ex.explode_dir; n.position.set(v[0] * e.distance, v[1] * e.distance, v[2] * e.distance); }
  });
  g.scene.traverse(o => { if (o.isMesh && o.material.name === 'mat_metal') { o.material.envMapIntensity = 1.2; } });
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3()).length();
  const el = cam[0] * Math.PI / 180, az = cam[1] * Math.PI / 180, dist = (cam[2] || 60) * (q.get('zoom') ? Number(q.get('zoom')) : 1);
  const tx = q.get('tx') ? q.get('tx').split(',').map(Number) : null; if (tx) c.set(tx[0], tx[2], -tx[1]);   // CAD (x,y,z) -> scene (x,z,-y)
  camera.position.set(c.x + dist * Math.cos(el) * Math.sin(az), c.y + dist * Math.sin(el), c.z + dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(c); r.render(scene, camera); requestAnimationFrame(() => { r.render(scene, camera); window.__ready = true; });
});
</script></body></html>
